
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewalsar Darpan - Social Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #14243b;
      background: linear-gradient(145deg, #f8fafc, #eaf0f7);
    }

    .container {
      width: 100%;
      max-width: 404px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #60738f;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .social-link {
      display: flex;
      align-items: center;
      min-height: 51px;
      gap: 13px;
      padding: 0 21px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
      text-align: left;
      box-shadow: 0 3px 5px rgba(22, 37, 59, 0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .social-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 14px rgba(22, 37, 59, 0.16);
    }

    .facebook {
      color: white;
      background: #1877f2;
    }

    .google {
      color: #14243b;
      background: white;
      border: 1px solid #dce4ed;
    }

    .instagram {
      color: white;
      background: linear-gradient(
        105deg,
        #873fc1,
        #e1306c,
        #fd282b,
        #ffb13f
      );
    }

    .icon {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
    }

    .facebook .icon {
      background: white;
      color: #1877f2;
      border-radius: 50%;
      width: 21px;
      height: 21px;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }

    .google .icon {
      font-size: 24px;
      font-weight: bold;
      background: conic-gradient(
        from -45deg,
        #4285f4 0deg 90deg,
        #34a853 90deg 180deg,
        #fbbc05 180deg 245deg,
        #ea4335 245deg 310deg,
        #4285f4 310deg
      );
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .instagram .icon {
      font-size: 25px;
    }

    .label {
      flex: 1;
    }

    .external {
      width: 18px;
      height: 18px;
      opacity: 0.85;
    }

    .status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      margin-top: 7px;
      color: #60738f;
      font-size: 11px;
    }

    .check {
      color: #10b981;
      font-size: 15px;
    }

    @media (max-width: 480px) {
      .container {
        max-width: 404px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>Social Links</h1>

    <p class="subtitle">
      Quick access to Facebook, Google, and Instagram
    </p>

    <nav class="links" aria-label="Social media links">

      <!-- FACEBOOK -->
      <a
        class="social-link facebook"
        href="https://www.facebook.com/share/19cHVpehfb/"
        target="_blank"
        rel="noopener noreferrer"
        data-name="Facebook"
      >
        <span class="icon">f</span>
        <span class="label">Facebook</span>

        <svg class="external" viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 4h6v6M20 4l-9 9"/>
          <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
        </svg>
      </a>

      <!-- GOOGLE -->
      <a
        class="social-link google"
        href="https://www.google.com/searchviewer/10?svid=CAwSHRIbCgNwdnESFENnMHZaeTh4TVhkeFpIUTFiV3QyGAo"
        target="_blank"
        rel="noopener noreferrer"
        data-name="Google"
      >
        <span class="icon">G</span>
        <span class="label">Google</span>

        <svg class="external" viewBox="0 0 24 24"
          fill="none" stroke="#7185a1"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 4h6v6M20 4l-9 9"/>
          <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
        </svg>
      </a>

      <!-- INSTAGRAM -->
      <a
        class="social-link instagram"
        href="https://www.instagram.com/rewalsar_darpan?cplk=MTcyeXRzcnEwazdyNg=="
        target="_blank"
        rel="noopener noreferrer"
        data-name="Instagram"
      >
        <span class="icon">◎</span>
        <span class="label">Instagram</span>

        <svg class="external" viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 4h6v6M20 4l-9 9"/>
          <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
        </svg>
      </a>

    </nav>

    <div class="status" id="status" role="status"
      aria-live="polite">
      <span class="check">✓</span>
      <span>Ready to open a link</span>
    </div>

  </main>

  <script>
    const status = document.getElementById("status");

    document.querySelectorAll(".social-link").forEach(link => {
      link.addEventListener("click", () => {
        const name = link.dataset.name;

        status.innerHTML =
          '<span class="check">✓</span>' +
          '<span>Opened ' + name + '</span>';
      });
    });
  </script>

</body>
</html>
